services:
  trilium:
    image: triliumnext/trilium:v0.106.0
    restart: unless-stopped
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
    ports:
      - '8181:8080'
    volumes:
      - /srv/docker-data/trilium:/home/node/trilium-data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro