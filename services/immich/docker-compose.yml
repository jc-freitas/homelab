
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.2.2
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Not the CIFS share: one mount option (retrans=5) kept Immich down for 7
      # hours there, and restic skipped 216 files without failing. The NAS holds
      # the copy, not the live library.
      - /srv/immich:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '10.0.20.2:2283:2283'
    depends_on:
      - database
    restart: always
    healthcheck:
      disable: false
    environment:
      - UPLOAD_LOCATION=/data
      - REDIS_HOSTNAME=redis-shared
      - REDIS_DBINDEX=2
      # On the PC (services/immich-ml-remote): the i5-7200U cannot afford the
      # ~40% CPU and 3GB the local ML costs.
      - IMMICH_MACHINE_LEARNING_URL=http://10.0.30.135:3003
    env_file:
      - .env
    networks:
      - default
      - shared-infra

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - immich_db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
    env_file:
      - .env

  postgres-exporter:
    container_name: immich-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    environment:
      DATA_SOURCE_USER: ${DB_USERNAME}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
      DATA_SOURCE_URI: "database:5432/${DB_DATABASE_NAME}?sslmode=disable"
    networks:
      - default
      - monitoring

volumes:
  immich_db:

networks:
  default:
  shared-infra:
    external: true
    name: shared-infra
  monitoring:
    external: true
    name: monitoring
