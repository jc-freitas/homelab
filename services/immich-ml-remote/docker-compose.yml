# Runs on the PC under Docker Desktop, not on the server. The tag has to match
# immich-server or the server refuses to start -- see README.md.

services:
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    volumes:
      - model-cache:/cache
    restart: unless-stopped
    ports:
      - "3003:3003"

volumes:
  model-cache:
