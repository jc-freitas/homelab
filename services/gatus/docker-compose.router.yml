# Runs on the router so it still reports when the server is what is down.
# Deployed at /opt/docker-usb/gatus/. Port 8087 because a ghost docker-proxy
# still re-spawns on 8083 at every start.

services:
  gatus:
    image: twinproduction/gatus:v5.37.0
    container_name: gatus
    restart: unless-stopped
    env_file:
      - /opt/docker-usb/gatus/.env
    environment:
      - GATUS_LOG_LEVEL=INFO
      - PORT=8080
    volumes:
      - /opt/docker-usb/gatus:/config
      - /opt/docker-usb/gatus/data:/data
      # Distroless and no tzdata on the router: Go reads /etc/localtime, and a TZ
      # variable would look for a zoneinfo db that is not there.
      - /opt/docker-usb/gatus/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:8087:8080"

networks:
  default:
    name: apps
    external: true
