services:
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:2026.9.4
    volumes:
      - home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: false
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
  node-red:
    container_name: nodered
    image: nodered/node-red:4.1.12
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
    ports:
      - "10.0.20.2:1880:1880"
    volumes:
      - nodered:/data

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      # all interfaces on purpose: home assistant runs on the host network
      # and connects to this broker over localhost
      - "1883:1883"
    volumes:
      - ./intelbras/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./intelbras/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

  intelbras-bridge:
    container_name: intelbras-bridge
    # The build context and this .env live in the private ops repo -- they carry the
    # intelbras cloud account and the device serial. Same condition as the .example configs.
    build: ./intelbras/bridge
    restart: unless-stopped
    depends_on:
      - mosquitto
    env_file:
      - ./intelbras/bridge/.env

  # Exposes HA entities to Alexa as Matter devices, which answer right away --
  # the Intelbras skill only reflects a change on its next poll. Matter
  # commissioning and mDNS only work on the host network (5540).
  matter-hub:
    container_name: matter-hub
    image: ghcr.io/riddix/home-assistant-matter-hub:2.0.48
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./matter-hub/.env
    volumes:
      - ./matter-hub/data:/data

volumes:
  home-assistant:
  nodered:
  mosquitto-data:
