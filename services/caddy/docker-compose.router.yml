# Runs on the router, deployed at /opt/docker-usb/caddy/. LuCI's uhttpd has to be
# bound to the management VLAN (10.0.1.1) to leave 80/443 free here.
services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
