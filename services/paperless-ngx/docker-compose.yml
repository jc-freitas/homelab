# Documents live on the NAS over CIFS, but the Whoosh index and Postgres stay on
# local disk: both mmap, and mmap over CIFS amplifies I/O badly.

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2
    container_name: paperless
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
    environment:
      - USERMAP_UID=1000
      - USERMAP_GID=1000
      - PAPERLESS_TIME_ZONE=America/Sao_Paulo
      - PAPERLESS_URL=http://paperless.home.arpa
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}

      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DBPASS}
      # redis-shared, db 3: the other two are taken by n8n and rsshub
      - PAPERLESS_REDIS=redis://redis-shared:6379/3

      # The image ships no Portuguese: an s6 init script apt-installs these at
      # container start, so a recreate needs working internet.
      - PAPERLESS_OCR_LANGUAGE=por+eng
      - PAPERLESS_OCR_LANGUAGES=por eng
      - PAPERLESS_OCR_MODE=auto
      - PAPERLESS_ARCHIVE_FILE_GENERATION=auto
      - PAPERLESS_OCR_DESKEW=true
      - PAPERLESS_OCR_ROTATE_PAGES=true

      # 4 threads shared with ~40 containers: unthrottled OCR pushes load past 20
      # and makes the rest of the lab unusable.
      - PAPERLESS_TASK_WORKERS=2
      - PAPERLESS_THREADS_PER_WORKER=1
      - PAPERLESS_WEBSERVER_WORKERS=2

      # inotify does not work over CIFS, so polling is mandatory. The retry and
      # delay pair keeps a file still being copied from being consumed half-written.
      - PAPERLESS_CONSUMER_POLLING=60
      - PAPERLESS_CONSUMER_POLLING_RETRY_COUNT=8
      - PAPERLESS_CONSUMER_POLLING_DELAY=5
      - PAPERLESS_CONSUMER_RECURSIVE=true
      - PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS=true
      - PAPERLESS_CONSUMER_DELETE_DUPLICATES=true

      # 3.x wants Jinja double braces; the old single-brace form is rejected.
      - PAPERLESS_FILENAME_FORMAT={{ created_year }}/{{ correspondent }}/{{ created }}_{{ title }}
      - PAPERLESS_FILENAME_FORMAT_REMOVE_NONE=true

      # Read on first start only, to create the superuser.
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
    volumes:
      - paperless-data:/usr/src/paperless/data
      - /mnt/media-smb/paperless/media:/usr/src/paperless/media
      - /mnt/media-smb/paperless/consume:/usr/src/paperless/consume
      # document_exporter target, deliberately outside the media root
      - /mnt/media-smb/paperless/export:/export
    ports:
      - "10.0.20.2:8010:8000"
    networks:
      - default
      - shared-infra

  paperless-db:
    image: postgres:17.11-alpine
    container_name: paperless-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${PAPERLESS_DBPASS}
    volumes:
      - paperless-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

volumes:
  paperless-data:
  paperless-db:

networks:
  shared-infra:
    external: true
    name: shared-infra
