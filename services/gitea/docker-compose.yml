networks:
  gitea:
    external: false

volumes:
  # Holds the runner's registration, and Gitea cannot reissue a token for an
  # existing runner -- recreating this volume means registering again.
  gitea-runner-data:
    external: true

services:
  server:
    image: docker.gitea.com/gitea:1.27.3
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    networks:
      - gitea
    volumes:
      - /srv/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "10.0.20.2:3022:3000"
      - "222:22"

  runner:
    image: gitea/act_runner:0.6.1
    container_name: gitea-runner
    restart: unless-stopped
    environment:
      - GITEA_INSTANCE_URL=http://10.0.20.2:3022
      - GITEA_RUNNER_LABELS=docker
    volumes:
      - gitea-runner-data:/data
      # Job steps run inside this container, so a deploy target it writes to has
      # to be mounted here; the rest is reached through the socket.
      - /opt/tgbot:/opt/tgbot
      - /var/run/docker.sock:/var/run/docker.sock
