# Runs on the router, not the server: it is the only always-on device, so the
# vault answers when the server is down -- which is when you need a password.
# Deployed at /opt/docker-usb/vaultwarden/ as docker-compose.yml.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: unless-stopped
    # raw: ADMIN_TOKEN is an Argon2 PHC string, and compose would read its
    # $-delimited fields as variable references and blank them out.
    env_file:
      - path: vw.env
        format: raw
    volumes:
      - /opt/docker-usb/vaultwarden/data:/data
    ports:
      - "10.0.20.1:8084:80"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
    networks:
      - apps

networks:
  apps:
    external: true
