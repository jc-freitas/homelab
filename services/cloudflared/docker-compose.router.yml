# Runs on the router, the only always-on device, so the tunnel and the vault it
# fronts stay up while the server is down. Deployed at /opt/docker-usb/cloudflared/.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    env_file: .env
